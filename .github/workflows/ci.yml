name: Tests, package checks and Pages

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and optional dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,test]"
          python -m pip check
      - name: Python syntax and automated tests
        run: |
          python -m compileall -q agents he_slide_harmonizer_agent cli.py slide_harmonizer.py enrichment.py
          python -m pytest -q
      - name: Installed CLI entry point
        run: |
          he-slide-harmonizer-agent verify-audit
          he-slide-harmonizer-engine --help

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax and normalization tests
        run: |
          node --check web/app.mjs
          node --check web/harmonizer.mjs
          node --test tests/browser.test.mjs
      - name: Verify static page entry
        run: |
          test -f web/index.html
          grep -q 'src="./app.mjs"' web/index.html

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [python, browser]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
