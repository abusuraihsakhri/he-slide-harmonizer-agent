[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "he-slide-harmonizer-agent"
version = "2.0.0"
description = "H&E Slide Harmonizer: Multi-Scanner Optical Stain Normalization & Color Deconvolution Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
he-slide-harmonizer-agent = "cli:main"
he-slide-harmonizer-agent = "he_slide_harmonizer_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/he-slide-harmonizer-agent"
Repository = "https://github.com/abusuraihsakhri/he-slide-harmonizer-agent.git"

[tool.setuptools]
py-modules = ["cli", "slide_harmonizer", "enrichment", "simulator"]

[tool.setuptools.packages.find]
include = ["agents*", "he_slide_harmonizer_agent*"]
